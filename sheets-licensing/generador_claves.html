<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Claves de Licencia - Flor Martínez</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F6F2; }
  </style>
</head>
<body class="p-6 md:p-12 text-slate-800">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <div class="bg-[#0D1B2A] text-white p-6 md:p-8 rounded-2xl shadow-sm flex items-center justify-between">
      <div>
        <span class="px-3 py-1 bg-white/10 text-emerald-300 text-xs font-semibold rounded-full uppercase tracking-wider">
          Herramienta Interna
        </span>
        <h1 class="text-2xl font-extrabold tracking-tight mt-2">Generador de Claves de Licencia</h1>
        <p class="text-slate-300 text-sm mt-1">Generá claves comerciales válidas para tus clientes con algoritmo matemático local (Cero carteles de Google).</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-[#E2DBD2] shadow-sm space-y-4">
      <div class="flex items-center gap-4">
        <label class="text-sm font-bold text-[#0D1B2A]">Cantidad de claves a generar:</label>
        <input type="number" id="cant" value="10" min="1" max="100" class="w-24 px-3 py-2 border border-slate-300 rounded-xl font-bold text-center">
        <button onclick="generar()" class="px-5 py-2.5 bg-[#0D1B2A] hover:bg-[#1E3A5F] text-white text-xs font-bold rounded-xl transition">
          ✨ Generar Claves
        </button>
      </div>

      <div class="border-t border-slate-100 pt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Claves listas para entregar:</span>
          <button onclick="copiarTodas()" class="text-xs font-bold text-blue-600 hover:underline">📋 Copiar todas</button>
        </div>
        <div id="lista" class="space-y-2 font-mono text-sm max-h-96 overflow-y-auto pr-2"></div>
      </div>
    </div>

  </div>

  <script>
    function calcularChecksum(str) {
      let hash = 5381;
      const salt = 'FLOR_MARTINEZ_2026_SECRET';
      const combined = str + salt;
      for (let i = 0; i < combined.length; i++) {
        hash = ((hash * 33) ^ combined.charCodeAt(i)) >>> 0;
      }
      let code = Math.abs(hash).toString(36).toUpperCase();
      while (code.length < 4) code = '0' + code;
      return code.substring(0, 4);
    }

    function generarClaveUnica() {
      // 4 caracteres aleatorios
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let seed = '';
      for (let i = 0; i < 4; i++) {
        seed += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const check = calcularChecksum(seed);
      return 'FM-' + seed + '-' + check;
    }

    let clavesActuales = [];

    function generar() {
      const cant = parseInt(document.getElementById('cant').value, 10) || 10;
      clavesActuales = [];
      const cont = document.getElementById('lista');
      cont.innerHTML = '';

      for (let i = 0; i < cant; i++) {
        const clave = generarClaveUnica();
        clavesActuales.push(clave);
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200';
        item.innerHTML = `
          <span class="font-extrabold text-[#0D1B2A] tracking-wider">${clave}</span>
          <button onclick="navigator.clipboard.writeText('${clave}'); this.innerText='¡Copiada!'; setTimeout(()=>this.innerText='Copiar', 1500)" class="text-xs px-3 py-1 bg-white hover:bg-slate-100 border border-slate-300 font-bold rounded-lg transition">
            Copiar
          </button>
        `;
        cont.appendChild(item);
      }
    }

    function copiarTodas() {
      if (!clavesActuales.length) return;
      navigator.clipboard.writeText(clavesActuales.join('\n'));
      alert('¡Todas las claves han sido copiadas al portapapeles!');
    }

    generar();
  </script>
</body>
</html>
